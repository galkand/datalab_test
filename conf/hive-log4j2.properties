status = warn
name = HiveLog4j2

appenders = console

appender.console.type = Console
appender.console.name = STDOUT
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} %-5p [%t] %c{2}: %m%n%throwable

rootLogger.level = info
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT

# HiveServer2 lifecycle / startup problems
logger.hiveserver2.name = org.apache.hive.service.server.HiveServer2
logger.hiveserver2.level = debug
logger.hiveserver2.additivity = false
logger.hiveserver2.appenderRefs = stdout
logger.hiveserver2.appenderRef.stdout.ref = STDOUT

# Thrift transport/auth issues
logger.thrift.name = org.apache.thrift
logger.thrift.level = debug
logger.thrift.additivity = false
logger.thrift.appenderRefs = stdout
logger.thrift.appenderRef.stdout.ref = STDOUT

# Hadoop security / UGI / tokens
logger.hadoopsec.name = org.apache.hadoop.security
logger.hadoopsec.level = debug
logger.hadoopsec.additivity = false
logger.hadoopsec.appenderRefs = stdout
logger.hadoopsec.appenderRef.stdout.ref = STDOUT

# Metastore client/server
logger.metastore.name = org.apache.hadoop.hive.metastore
logger.metastore.level = info

# JDBC / connection pool noise (оставим info, чтобы не утонуть)
logger.zaxxer.name = com.zaxxer.hikari
logger.zaxxer.level = info
