name: datalab

networks:
  datalab:
    name: datalabnet
volumes:
  nn_data:
  dn_data:
  metastore_db:
  minio_data:
  airflow_db:
  clickhouse_data:
  superset_home:
  superset_db:

services:
  # =========================
  # CORE: HDFS
  # =========================
  namenode:
    image: apache/hadoop:3.4
    profiles: ["core"]
    container_name: namenode
    hostname: namenode
    networks: [datalab]
    user: root
    ports:
      - "9870:9870"   # NameNode UI
      - "8020:8020"   # NameNode RPC
    volumes:
      - nn_data:/hadoop/dfs/name
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    command: >
      bash -lc '
        set -euo pipefail;

        mkdir -p /hadoop/dfs/name;
        chmod 777 /hadoop/dfs/name || true;

        # форматируем только если состояния ещё нет
        if [ ! -f /hadoop/dfs/name/current/VERSION ]; then
          echo "Formatting NameNode (first run)...";
          hdfs namenode -format -force -nonInteractive;
        fi;

        exec hdfs namenode
      '
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfs -ls / >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30



  datanode:
    image: apache/hadoop:3.4
    profiles: ["core"]
    container_name: datanode
    hostname: datanode
    networks: [datalab]
    user: root
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9864:9864"   # DataNode UI
    volumes:
      - dn_data:/hadoop/dfs/data
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    command: >
      bash -lc '
        set -euo pipefail;

        mkdir -p /hadoop/dfs/data;
        chmod 777 /hadoop/dfs/data || true;

        exec hdfs datanode
      '
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 30

  # Инициализация HDFS директорий (warehouse, landing и т.п.)
  hdfs-init:
    image: apache/hadoop:3.4
    profiles: ["core"]
    container_name: hdfs-init
    hostname: hdfs-init
    networks: [datalab]
    user: root
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_USER_NAME: root
    entrypoint: >
      bash -lc '
        set -euo pipefail;

        echo "[hdfs-init] waiting for NameNode / HDFS..."
        # ждём, пока HDFS начнёт отвечать
        until hdfs dfs -ls / >/dev/null 2>&1; do
          sleep 2
        done

        # ждём выхода из safe mode (важно именно перед chmod/chown/mkdir)
        echo "[hdfs-init] waiting for safemode OFF..."
        while hdfs dfsadmin -safemode get 2>/dev/null | grep -q "Safe mode is ON"; do
          hdfs dfsadmin -safemode get || true
          sleep 2
        done
        echo "[hdfs-init] safemode OFF"

        hdfs dfs -mkdir -p /user/hive/warehouse;
        hdfs dfs -mkdir -p /data/landing /data/increment;

        # HDFS tmp
        hdfs dfs -mkdir -p /tmp /tmp/hive;
        hdfs dfs -chmod 1777 /tmp;
        hdfs dfs -chmod 1777 /tmp/hive;

        hdfs dfs -chmod -R 777 /data;
        hdfs dfs -chmod -R 777 /user/hive/warehouse;

        echo "[hdfs-init] done"
      '
    restart: "no"


  # =========================
  # CORE: Hive Metastore DB
  # =========================
  metastore-db:
    image: postgres:16
    profiles: ["core"]
    container_name: metastore-db
    hostname: metastore-db
    networks: [datalab]
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - metastore_db:/var/lib/postgresql/data
      - ./postgres-metastore-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 30

  # =========================
  # CORE: Hive (Metastore + HS2)
  # =========================
  hive-metastore:
    build:
      context: ./hive
    profiles: ["core"]
    container_name: hive-metastore
    hostname: hive-metastore
    networks: [datalab]
    depends_on:
      metastore-db:
        condition: service_healthy
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
    ports:
      - "9083:9083"
    volumes:
      - ./conf:/hive_custom_conf:ro
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SKIP_SCHEMA_INIT: "true"
      SERVICE_OPTS: >-
        -Dlog4j.configurationFile=file:/hive_custom_conf/hive-log4j2.properties
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    healthcheck:
      # Проверяем порт metastore thrift (bash /dev/tcp)
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/9083'"]
      interval: 10s
      timeout: 5s
      retries: 30

  hiveserver2:
    build:
      context: ./hive
    profiles: ["core"]
    container_name: hiveserver2
    hostname: hiveserver2
    networks: [datalab]
    depends_on:
      hive-metastore:
        condition: service_healthy
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./conf:/hive_custom_conf:ro
      - ./ddl:/workspace/ddl:ro      
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Dlog4j.configurationFile=file:/hive_custom_conf/hive-log4j2.properties
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/10000'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # =========================
  # CORE: MinIO (S3)
  # =========================
  minio:
    image: minio/minio
    profiles: ["core"]
    container_name: minio
    hostname: minio
    networks: [datalab]
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc
    profiles: ["core"]
    container_name: minio-init
    networks: [datalab]
    volumes:
      - ./data:/data:ro
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -eu;

      echo '[minio-init] configuring alias';
      mc alias set local http://minio:9000 minioadmin minioadmin123;

      echo '[minio-init] creating bucket and lake prefixes';
      mc mb -p local/raw || true;
      mc mb -p local/landing || true;

      mc mb -p local/raw/yelp/business/full || true;
      mc mb -p local/raw/yelp/business/increment || true;
      mc mb -p local/raw/yelp/review/full || true;
      mc mb -p local/raw/yelp/review/increment || true;

      echo '[minio-init] setting anonymous download policy for raw bucket';
      mc anonymous set download local/raw || true;

      echo '[minio-init] validating source files';
      [ -s /data/business.json ] || { echo '[minio-init] ERROR: /data/business.json is missing or empty'; exit 2; }
      [ -s /data/review.json ] || { echo '[minio-init] ERROR: /data/review.json is missing or empty'; exit 2; }

      if mc stat local/raw/yelp/business/full/business.json >/dev/null 2>&1; then
        echo '[minio-init] business dataset already exists, skipping upload';
      else
        echo '[minio-init] uploading business dataset';
        mc cp /data/business.json local/raw/yelp/business/full/business.json;
      fi

      if mc stat local/raw/yelp/review/full/review.json >/dev/null 2>&1; then
        echo '[minio-init] review dataset already exists, skipping upload';
      else
        echo '[minio-init] uploading review dataset';
        mc cp /data/review.json local/raw/yelp/review/full/review.json;
      fi

      echo '[minio-init] listing uploaded objects';
      mc ls local/raw/yelp/business/full;
      mc ls local/raw/yelp/review/full;

      echo '[minio-init] MinIO bootstrap completed successfully';
      "
    restart: 'no'

  # =========================
  # SPARK cluster (profile=spark)
  # =========================
  spark-master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    profiles: ["spark"]
    container_name: spark-master
    hostname: spark-master
    networks: [datalab]
    depends_on:
      namenode:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8081:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./conf:/opt/conf:ro
    environment:
      SPARK_HOME: /opt/spark
      HADOOP_CONF_DIR: /opt/conf
      SPARK_CONF_DIR: /opt/conf
      PATH: /opt/spark/bin:/opt/spark/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: ["bash", "-lc", "/opt/spark/sbin/start-master.sh --host spark-master --port 7077 --webui-port 8080; tail -f /opt/spark/logs/*"]

  spark-worker-1:
    build:
      context: .
      dockerfile: spark/Dockerfile
    profiles: ["spark"]
    container_name: spark-worker-1
    hostname: spark-worker-1
    networks: [datalab]
    depends_on:
      spark-master:
        condition: service_started
    ports:
      - "8082:8081"
    volumes:
      - ./conf:/opt/conf:ro
    environment:
      SPARK_HOME: /opt/spark
      HADOOP_CONF_DIR: /opt/conf
      SPARK_CONF_DIR: /opt/conf
      PATH: /opt/spark/bin:/opt/spark/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: ["bash", "-lc", "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 --webui-port 8081; tail -f /opt/spark/logs/*"]

  spark-worker-2:
    build:
      context: .
      dockerfile: spark/Dockerfile
    profiles: ["spark"]
    container_name: spark-worker-2
    hostname: spark-worker-2
    networks: [datalab]
    depends_on:
      spark-master:
        condition: service_started
    ports:
      - "8083:8081"
    volumes:
      - ./conf:/opt/conf:ro
    environment:
      SPARK_HOME: /opt/spark
      HADOOP_CONF_DIR: /opt/conf
      SPARK_CONF_DIR: /opt/conf
      PATH: /opt/spark/bin:/opt/spark/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: ["bash", "-lc", "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 --webui-port 8081; tail -f /opt/spark/logs/*"]

  spark-worker-3:
    build:
      context: .
      dockerfile: spark/Dockerfile
    profiles: ["spark"]
    container_name: spark-worker-3
    hostname: spark-worker-3
    networks: [datalab]
    depends_on:
      spark-master:
        condition: service_started
    ports:
      - "8084:8081"
    volumes:
      - ./conf:/opt/conf:ro
    environment:
      SPARK_HOME: /opt/spark
      HADOOP_CONF_DIR: /opt/conf
      SPARK_CONF_DIR: /opt/conf
      PATH: /opt/spark/bin:/opt/spark/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: ["bash", "-lc", "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 --webui-port 8081; tail -f /opt/spark/logs/*"]




   # =========================
  # AIRFLOW (profile=airflow)
  # =========================

  airflow-db:
    image: postgres:16
    profiles: ["airflow"]
    container_name: airflow-db
    hostname: airflow-db
    networks: [datalab]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 30

  airflow-init:
    build:
      context: ./airflow
    profiles: ["airflow"]
    container_name: airflow-init
    hostname: airflow-init
    networks: [datalab]
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      # Admin user (MVP)
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com
      _AIRFLOW_WWW_USER_ROLE: Admin

      # Для S3KeySensor / S3Hook (MinIO)
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_DEFAULT_REGION: us-east-1
      AIRFLOW_CONN_MINIO_S3: aws://minioadmin:minioadmin123@?endpoint_url=http%3A%2F%2Fminio%3A9000
      
      # Для SparkSubmitOperator
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077

      # Hadoop client конфиги (если понадобится hdfs из BashOperator)
      HADOOP_CONF_DIR: /opt/conf
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./conf:/opt/conf:ro
    command: ["bash", "-lc", "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true"]
    restart: "no"

  airflow-webserver:
    build:
      context: ./airflow
    profiles: ["airflow"]
    container_name: airflow-webserver
    hostname: airflow-webserver
    networks: [datalab]
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      namenode:
        condition: service_healthy
      spark-master:
        condition: service_started
    ports:
      - "8088:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      # Для S3KeySensor / S3Hook (MinIO)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AIRFLOW_CONN_MINIO_S3: ${AIRFLOW_CONN_MINIO_S3}

      S3A_ENDPOINT: ${S3A_ENDPOINT}
      S3A_ACCESS_KEY: ${S3A_ACCESS_KEY}
      S3A_SECRET_KEY: ${S3A_SECRET_KEY}

      CH_HOST: ${CH_HOST}
      CH_PORT: ${CH_PORT}
      CH_DB: ${CH_DB}
      CH_USER: ${CH_USER}
      CH_PASSWORD: ${CH_PASSWORD}

      SPARK_PROFILE: ${SPARK_PROFILE}
      SPARK_SQL_SHUFFLE_PARTITIONS: ${SPARK_SQL_SHUFFLE_PARTITIONS}

      # Hadoop client конфиги
      HADOOP_CONF_DIR: /opt/conf
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/jobs:/opt/airflow/jobs
      - ./airflow/logs:/opt/airflow/logs
      - ./conf:/opt/conf:ro
    command: ["bash", "-lc", "airflow webserver"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30

  airflow-scheduler:
    build:
      context: ./airflow
    profiles: ["airflow"]
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    networks: [datalab]
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

     # Для S3KeySensor / S3Hook (MinIO)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AIRFLOW_CONN_MINIO_S3: ${AIRFLOW_CONN_MINIO_S3}

      S3A_ENDPOINT: ${S3A_ENDPOINT}
      S3A_ACCESS_KEY: ${S3A_ACCESS_KEY}
      S3A_SECRET_KEY: ${S3A_SECRET_KEY}

      CH_HOST: ${CH_HOST}
      CH_PORT: ${CH_PORT}
      CH_DB: ${CH_DB}
      CH_USER: ${CH_USER}
      CH_PASSWORD: ${CH_PASSWORD}

      SPARK_PROFILE: ${SPARK_PROFILE}
      SPARK_SQL_SHUFFLE_PARTITIONS: ${SPARK_SQL_SHUFFLE_PARTITIONS}

      # Hadoop client конфиги
      HADOOP_CONF_DIR: /opt/conf
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/jobs:/opt/airflow/jobs
      - ./airflow/logs:/opt/airflow/logs
      - ./conf:/opt/conf:ro
    command: ["bash", "-lc", "airflow scheduler"]

  # =========================
  # BI: ClickHouse (profile=bi)
  # =========================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["bi"]
    container_name: clickhouse
    hostname: clickhouse
    networks: [datalab]
    ports:
      - "8123:8123"   # HTTP
      - "9009:9000"   # Native (host 9009, чтобы не конфликтовать с MinIO:9000)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./ddl:/workspace/ddl:ro
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 30

  # =========================
  # BI: Superset DB (profile=bi)
  # =========================
  superset-db:
    image: postgres:16
    profiles: ["bi"]
    container_name: superset-db
    hostname: superset-db
    networks: [datalab]
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 30

  # =========================
  # BI: Superset (profile=bi)
  # =========================
  superset-init:
    image: apache/superset:4.0.2
    profiles: ["bi"]
    container_name: superset-init
    hostname: superset-init
    networks: [datalab]
    depends_on:
      superset-db:
        condition: service_healthy
    volumes:
      - superset_home:/app/superset_home
    environment:
      SUPERSET_SECRET_KEY: "change_me_in_real_life"
      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:superset@superset-db:5432/superset
      SUPERSET_LOAD_EXAMPLES: "no"

      SUPERSET_ADMIN_USERNAME: "admin"
      SUPERSET_ADMIN_FIRSTNAME: "Admin"
      SUPERSET_ADMIN_LASTNAME: "User"
      SUPERSET_ADMIN_EMAIL: "admin@example.com"
      SUPERSET_ADMIN_PASSWORD: "admin"
    command: >
      bash -lc '
        set -e;

        pip install --no-cache-dir "clickhouse-connect>=0.7" >/dev/null;
        pip uninstall -y sqlalchemy-clickhouse >/dev/null 2>&1 || true;

        superset db upgrade;
        superset init;

        superset fab create-admin --username "$${SUPERSET_ADMIN_USERNAME}" --firstname "$${SUPERSET_ADMIN_FIRSTNAME}" --lastname "$${SUPERSET_ADMIN_LASTNAME}" --email "$${SUPERSET_ADMIN_EMAIL}" --password "$${SUPERSET_ADMIN_PASSWORD}" || true;
      '

    restart: "no"

  superset:
    image: apache/superset:4.0.2
    profiles: ["bi"]
    container_name: superset
    hostname: superset
    networks: [datalab]
    depends_on:
      superset-db:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    ports:
      - "8089:8088"
    volumes:
      - superset_home:/app/superset_home
    environment:
      SUPERSET_SECRET_KEY: "change_me_in_real_life"
      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:superset@superset-db:5432/superset
      SUPERSET_LOAD_EXAMPLES: "no"
    command: >
      bash -lc '
        set -e;
        pip install --no-cache-dir "clickhouse-connect>=0.7" >/dev/null;
        pip uninstall -y sqlalchemy-clickhouse >/dev/null 2>&1 || true;
        /usr/bin/run-server.sh
      '
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8088/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
